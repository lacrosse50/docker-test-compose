services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:2.10.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=6da397fb9d0c21a3c857d336b8a798d2e873390a307821b50dd6e5ebe58ee77e
    ports:
      - '7575:7575'
